<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>表格弹窗 · Ctrl+滚轮缩放 原型（Excel 式真尺寸重排）</title>
<style>
  /* ---- 仿 Obsidian 默认（浅色）主题变量 ---- */
  :root {
    --background-primary: #ffffff;
    --background-secondary: #f6f7f8;
    --background-secondary-alt: #ebedef;
    --background-modifier-border: #e0e2e7;
    --background-modifier-hover: rgba(0,0,0,.05);
    --text-normal: #2e3338;
    --text-muted: #888c93;
    --text-faint: #b3b6bd;
    --text-error: #c0392b;
    --interactive-accent: #7b5cd6;
    --interactive-accent-hover: #6a4fc4;
    --icon-color: #6b7077;
    --font-ui: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-ui);
    background: #1e1e1e;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* ---- 弹窗外壳 ---- */
  .mtk-modal-shell {
    width: 920px;
    max-width: 100%;
    height: 600px;
    background: var(--background-primary);
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .mtk-editor {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* ---- 顶栏 ---- */
  .mtk-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--background-modifier-border);
  }
  .mtk-title { font-weight: 600; font-size: 15px; color: var(--text-normal); }
  .mtk-mode {
    font-size: 11px; color: var(--text-muted);
    border: 1px solid var(--background-modifier-border);
    border-radius: 4px; padding: 1px 6px;
  }

  /* ---- 工具条 ---- */
  .mtk-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--background-modifier-border);
    background: var(--background-secondary);
    flex-wrap: wrap;
  }
  .mtk-tb-icon-btn {
    height: 30px; min-width: 30px;
    border: none; background: transparent;
    border-radius: 6px;
    color: var(--icon-color);
    font-size: 14px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 8px;
  }
  .mtk-tb-icon-btn:hover { background: var(--background-modifier-hover); }
  .mtk-divider { width: 1px; height: 20px; background: var(--background-modifier-border); margin: 0 4px; }

  /* 缩放组（对齐 chart-panel 风格） */
  .mtk-zoom-group { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; }
  .mtk-zoom-pct {
    min-width: 52px; text-align: center;
    font-size: 12px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    cursor: pointer; user-select: none;
    border-radius: 6px; padding: 4px 6px;
  }
  .mtk-zoom-pct:hover { background: var(--background-modifier-hover); color: var(--text-normal); }

  /* ---- 公式栏 ---- */
  .mtk-fxbar {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px;
    border-bottom: 1px solid var(--background-modifier-border);
  }
  .mtk-ref-box {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--background-modifier-border);
    border-radius: 6px; padding: 3px 8px;
    font-size: 12px; color: var(--text-normal);
    cursor: pointer; min-width: 56px; justify-content: center;
  }
  .mtk-fx-group { display: flex; align-items: center; gap: 6px; flex: 1; }
  .mtk-fx-btn {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid var(--background-modifier-border);
    background: var(--background-primary); cursor: pointer; font-style: italic;
  }
  .mtk-fx-sep { width: 1px; height: 18px; background: var(--background-modifier-border); }
  .mtk-fx-group .val {
    flex: 1; height: 28px; border: 1px solid var(--background-modifier-border);
    border-radius: 6px; padding: 0 10px; font-size: 13px; outline: none;
  }
  .mtk-fx-group .val:focus { border-color: var(--interactive-accent); }

  /* ---- 画布 / 网格（Excel 式「真尺寸重排」：列宽/行高/字号都按 k 放大） ---- */
  .mtk-canvas.is-sheet { position: relative; flex: 1; min-height: 0; }
  .mtk-grid { position: absolute; inset: 0; background: var(--background-secondary); pointer-events: none; }

  .mtk-tbl-scroll {
    position: absolute; inset: 0;
    overflow-y: scroll; overflow-x: auto;
    background: var(--background-primary);
  }
  .mtk-tbl-sheet {
    position: relative;
    width: max-content; min-width: 100%;
    user-select: none;
  }

  .mtk-sheet-row { display: flex; }
  .mtk-sheet-row.is-head { position: sticky; top: 0; z-index: 3; }

  /* 字号 / 边框 / 内边距 / 行高 全部跟着 --mtk-zoom 走，文字始终清晰 */
  .mtk-sheet-cell {
    flex: 0 0 auto;
    height: calc(34px * var(--mtk-zoom, 1));
    line-height: calc(34px * var(--mtk-zoom, 1));
    padding: 0 calc(10px * var(--mtk-zoom, 1));
    border-right: calc(1px * var(--mtk-zoom, 1)) solid var(--background-modifier-border);
    border-bottom: calc(1px * var(--mtk-zoom, 1)) solid var(--background-modifier-border);
    font-size: calc(13px * var(--mtk-zoom, 1));
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background-color: var(--background-primary);
    cursor: cell;
  }
  .mtk-sheet-row.is-head .mtk-sheet-cell {
    background-color: var(--background-secondary);
    font-weight: 600; text-align: center; padding: 0; cursor: default;
  }
  /* 行号列：宽度也跟着缩放 */
  .mtk-sheet-gutter {
    position: sticky; left: 0; z-index: 2;
    width: calc(42px * var(--mtk-zoom, 1));
    flex: 0 0 calc(42px * var(--mtk-zoom, 1));
    padding: 0; text-align: center;
    font-size: calc(11px * var(--mtk-zoom, 1));
    font-weight: 400; color: var(--text-faint);
    background-color: var(--background-secondary); cursor: default;
  }
  .mtk-sheet-row.is-head .mtk-sheet-gutter { z-index: 4; }
  .mtk-sheet-gutter:not(.is-filler) { font-weight: 600; color: var(--text-muted); }
  .mtk-sheet-gutter.is-hl { color: var(--text-normal); }

  .mtk-sheet-cell.is-num { text-align: right; }
  .mtk-sheet-cell.is-fx { background-color: rgba(123,92,214,.07); }
  .mtk-sheet-cell.is-selected {
    position: relative; z-index: 1;
    outline: 2px solid var(--interactive-accent); outline-offset: -2px;
  }

  /* ---- 操作提示 ---- */
  .mtk-hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: rgba(46,51,56,.92); color: #fff;
    font-size: 12px; padding: 7px 14px; border-radius: 20px;
    pointer-events: none; transition: opacity .4s; z-index: 10;
  }
  .mtk-hint kbd {
    background: rgba(255,255,255,.18); border-radius: 4px;
    padding: 1px 5px; font-family: var(--font-ui); margin: 0 2px;
  }
</style>
</head>
<body>
  <div class="mtk-modal-shell">
    <div class="mtk-editor">
      <div class="mtk-header">
        <span class="mtk-title">表格</span>
        <span class="mtk-mode">table</span>
      </div>

      <div class="mtk-toolbar">
        <button class="mtk-tb-icon-btn" title="保存">💾</button>
        <span class="mtk-divider"></span>
        <button class="mtk-tb-icon-btn" title="格式刷">🖌</button>
        <button class="mtk-tb-icon-btn" title="左对齐">⬅</button>
        <button class="mtk-tb-icon-btn" title="居中">↔</button>
        <button class="mtk-tb-icon-btn" title="右对齐">➡</button>
        <button class="mtk-tb-icon-btn" title="背景色">🎨</button>
        <button class="mtk-tb-icon-btn" title="字体色">A</button>

        <!-- 缩放组：对齐 chart-panel 的 zoomOut / zoomLabel / zoomIn -->
        <span class="mtk-zoom-group">
          <button class="mtk-tb-icon-btn" id="zoomOut" title="缩小">－</button>
          <span class="mtk-zoom-pct" id="zoomPct" title="点击重置为 100%">100%</span>
          <button class="mtk-tb-icon-btn" id="zoomIn" title="放大">＋</button>
        </span>
      </div>

      <div class="mtk-fxbar">
        <div class="mtk-ref-box"><span class="ref">B3</span><span>⌄</span></div>
        <div class="mtk-fx-group">
          <button class="mtk-fx-btn">fx</button>
          <span class="mtk-fx-sep"></span>
          <input class="val" type="text" spellcheck="false" value="华东" />
        </div>
      </div>

      <div class="mtk-canvas is-sheet">
        <div class="mtk-grid"></div>
        <div class="mtk-tbl-scroll" id="scroll">
          <!-- 真尺寸重排：没有缩放层，sheet 直接按内容尺寸变大变小 -->
          <div class="mtk-tbl-sheet" id="sheet"></div>
        </div>
        <div class="mtk-hint" id="hint">按住 <kbd>Ctrl</kbd> + 滚动滚轮 缩放（Excel 式：A1 始终钉在左上角，文字清晰）</div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- 1. 造一张示例表 ----------
  const headers = ["产品", "地区", "一季度", "二季度", "三季度", "四季度", "合计", "备注"];
  const rows = [
    ["智能手表", "华东", 1280, 1420, 1560, 1710, "=SUM(C3:F3)", "主推"],
    ["智能手表", "华北", 980, 1060, 1120, 1240, "=SUM(C4:F4)", ""],
    ["蓝牙耳机", "华东", 2210, 2380, 2520, 2670, "=SUM(C5:F5)", "促销"],
    ["蓝牙耳机", "华南", 1740, 1690, 1820, 1950, "=SUM(C6:F6)", ""],
    ["扫地机", "华东", 860, 910, 940, 1010, "=SUM(C7:F7)", "新品"],
    ["扫地机", "西南", 540, 560, 590, 620, "=SUM(C8:F8)", ""],
    ["空气净化", "华北", 1190, 1240, 1310, 1380, "=SUM(C9:F9)", ""],
    ["空气净化", "华东", 1320, 1400, 1460, 1530, "=SUM(C10:F10)", "主推"],
    ["智能台灯", "华南", 760, 790, 820, 860, "=SUM(C11:F11)", ""],
    ["智能台灯", "东北", 430, 450, 470, 500, "=SUM(C12:F12)", ""],
    ["体脂秤", "华东", 980, 1010, 1040, 1090, "=SUM(C13:F13)", ""],
    ["体脂秤", "西北", 320, 340, 360, 390, "=SUM(C14:F14)", ""],
    ["加湿器", "华东", 610, 630, 650, 690, "=SUM(C15:F15)", ""],
    ["加湿器", "华南", 540, 560, 590, 620, "=SUM(C16:F16)", ""],
    ["电动牙刷", "华北", 880, 910, 940, 980, "=SUM(C17:F17)", ""],
    ["电动牙刷", "西南", 320, 340, 360, 390, "=SUM(C18:F18)", ""],
  ];

  const sheet = document.getElementById("sheet");
  const scroll = document.getElementById("scroll");
  const zoomPct = document.getElementById("zoomPct");
  const hint = document.getElementById("hint");

  const COL_W = [120, 90, 96, 96, 96, 96, 110, 80]; // 各列基础宽（未缩放）
  const GUTTER = 42;
  const ROW_H = 34;

  // 缩放档位（与插件 ZOOM_STEPS 一致）
  const ZOOM_STEPS = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
  let k = 1;

  function colPx(i) { return COL_W[i] * k; }
  function gutterPx() { return GUTTER * k; }

  // 行号列（表头左上角）
  const head = document.createElement("div");
  head.className = "mtk-sheet-row is-head";
  const headGutter = document.createElement("div");
  headGutter.className = "mtk-sheet-gutter";
  head.appendChild(headGutter);
  const headCells = [];
  headers.forEach((h, i) => {
    const c = document.createElement("div");
    c.className = "mtk-sheet-cell";
    c.textContent = h;
    head.appendChild(c);
    headCells.push(c);
  });
  sheet.appendChild(head);

  // 数据行：记录每列的单元格引用，缩放时改宽度
  const dataRows = rows.map((r, ri) => {
    const row = document.createElement("div");
    row.className = "mtk-sheet-row";
    const g = document.createElement("div");
    g.className = "mtk-sheet-gutter" + (ri >= rows.length ? " is-filler" : "");
    g.textContent = String(ri + 1);
    row.appendChild(g);
    const cells = [];
    r.forEach((v, ci) => {
      const c = document.createElement("div");
      c.className = "mtk-sheet-cell";
      if (typeof v === "number") c.classList.add("is-num");
      if (typeof v === "string" && v.startsWith("=")) c.classList.add("is-fx");
      c.textContent = v;
      row.appendChild(c);
      cells.push(c);
    });
    sheet.appendChild(row);
    return { gutter: g, cells };
  });

  // ---------- 2. 真尺寸重排 ----------
  // 列宽 / 行号宽用 JS 按 k 落成 px；字号 / 边框 / 内边距 / 行高走 CSS 的 --mtk-zoom。
  function layout() {
    sheet.style.setProperty("--mtk-zoom", String(k));
    headGutter.style.width = gutterPx() + "px";
    headGutter.style.flex = "0 0 " + gutterPx() + "px";
    headCells.forEach((c, i) => { c.style.width = colPx(i) + "px"; });
    dataRows.forEach((rowObj) => {
      rowObj.gutter.style.width = gutterPx() + "px";
      rowObj.gutter.style.flex = "0 0 " + gutterPx() + "px";
      rowObj.cells.forEach((c, i) => { c.style.width = colPx(i) + "px"; });
    });
    zoomPct.textContent = Math.round(k * 100) + "%";
  }

  // Excel 式锚点：左上角（A1）缩放后仍在左上角。
  // 缩放前记录光标/视口处的「内容坐标」，重排后让它重新落回原屏幕位置。
  function applyZoom(nextK) {
    if (nextK === k) return;
    const ux = scroll.scrollLeft / k;   // 内容坐标（未缩放）
    const uy = scroll.scrollTop / k;
    k = nextK;
    layout();                            // 整棵树按新尺寸重排
    scroll.scrollLeft = ux * k;          // 重排后再落位
    scroll.scrollTop = uy * k;
  }

  function step(dir) {
    const at = ZOOM_STEPS.indexOf(k);
    const from = at >= 0 ? at : ZOOM_STEPS.indexOf(1);
    const to = Math.min(ZOOM_STEPS.length - 1, Math.max(0, from + dir));
    if (to === from) return;
    applyZoom(ZOOM_STEPS[to]);
  }

  // Ctrl + 滚轮：档位式，左上角锚定
  scroll.addEventListener("wheel", function (e) {
    if (!e.ctrlKey) return;             // 仅 Ctrl 组合时接管，否则走原生滚动
    e.preventDefault();
    step(e.deltaY < 0 ? 1 : -1);
    hideHint();
  }, { passive: false });

  // 工具栏按钮
  document.getElementById("zoomIn").addEventListener("click", function () { step(1); hideHint(); });
  document.getElementById("zoomOut").addEventListener("click", function () { step(-1); hideHint(); });
  zoomPct.addEventListener("click", function () { applyZoom(1); });

  // 初始化
  layout();

  let hintTimer = setTimeout(hideHint, 6000);
  function hideHint() { clearTimeout(hintTimer); hint.style.opacity = "0"; }
})();
</script>
</body>
</html>
